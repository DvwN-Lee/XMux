interface:
  display_name: "xmux-send"
  short_description: "Use the explicit XMux send-pane trigger."
  default_prompt: "Use only when the prompt starts with $xmux-send or $xmux-send!. Parse <target> and body. For $xmux-send, synthesize a target-facing prompt; for $xmux-send!, use the literal body. Always wrap the delivered prompt with [xmux-send-message], then metadata lines source: $xmux-send or $xmux-send!, mode: synthesis or raw, delivery: one-way, target: <target>, a blank line, and the body. Run xmux send-pane --to <target> --prompt \"<full marked prompt>\" --transport-consent xmux-send --json; use --transport-consent 'xmux-send!' for raw mode. If target is missing or ambiguous, do not send and ask for a clearer target, including <project>/<session> syntax for cross-project targets. Add --force only if the user explicitly asks to override self-send or a busy target. Do not wait for, read, summarize, or confirm target responses in the same turn. Report only delivery failure when the send command fails. Never use raw tmux/send-keys/paste-buffer, legacy xmux sendPane, teammate/MCP paths, or xmux claude send for this skill."

policy:
  allow_implicit_invocation: false
